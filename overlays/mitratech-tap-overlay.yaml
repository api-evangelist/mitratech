  method: generated
  source: openapi/_original/mitratech-tap-swagger.json
  extends: openapi/_original/mitratech-tap-swagger.json
  note: >-
    Non-destructive Overlay 1.0.0 capturing API Evangelist's enrichment of the harvested TAP
    Swagger 2.0 document. It adds the auth model the original omits entirely, declares the missing
