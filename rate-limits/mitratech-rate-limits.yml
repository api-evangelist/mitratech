note: >-
  No rate limits are published for any Mitratech API. The TAP API documentation page contains no
  occurrence of "rate limit", "throttle", "Retry-After" or any X-RateLimit/RateLimit-* header, and the
  135KB TAP Swagger document declares no 429 response on any of its 49 operations. The only
  quantitative guardrails Mitratech publishes are UI-side: a dashboard warning above 30 columns and a
  minimum three-character search term. An agent has no published budget to plan against and no
  runtime signal to back off on.
