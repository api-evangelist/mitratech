summary: Mitratech operates both an OpenAPI-described REST surface (TAP) and a live MCP server (mitratech.com),
  but they are different products on different hosts and nothing published binds them. The MCP server's
  tools/list is OAuth-gated (HTTP 401) and Mitratech publishes no MCP tool documentation and no llms.txt
  tool list, so there is no name or schema to map against. Every TAP operation is therefore recorded as
  rest_only and crosswalk[] is deliberately empty — mapping an unknown tool set to TAP operationIds would
  be invention, not derivation.
