aid: mitratech
name: Mitratech
description: >-
  Mitratech is an Austin, Texas based enterprise software company supplying legal operations, governance,
  risk and compliance, and HR compliance software to corporate legal departments, compliance teams and
  human resources organizations. Its platform spans enterprise legal management and matter management
  (TeamConnect), legal spend and e-billing, no-code workflow automation and intake (TAP Workflow Automation,
  acquired with ThinkSmart), policy and risk management (PolicyHub, Alyne), immigration case management
  (INSZoom), HR compliance, talent and background screening (Mineral, Trakstar, AssureHire, Circa), and
  contract lifecycle management. Programmatic access is delivered per-product and per-tenant rather than
  through a single public developer portal: TAP publishes an OData-style REST API with a live Swagger 2.0
  API Explorer, TeamConnect 7.2+ ships a modernized OAuth 2.0 REST API on each customer instance, and
  mitratech.com itself serves an OAuth-protected Model Context Protocol server.
url: https://raw.githubusercontent.com/api-evangelist/mitratech/refs/heads/main/apis.yml
image: https://mitratech.com/wp-content/uploads/Mitratech_Web-Assets_Home-Feature-Image-HD-1024x577.png
