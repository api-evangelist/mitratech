- name: Mitratech TeamConnect REST API
  description: >-
    Modernized REST API shipped with TeamConnect Enterprise 7.2 and later, served from each customer's own
    TeamConnect instance at /webservice/enterprise/. Exposes Accounts, Appointments, Contacts, Documents,
    Expenses, Groups, Histories, Invoices, Involved Parties, Projects (custom objects / matters), Tasks,
    Users, Workflows and System Design, with pagination, filtering and record-level search. Authentication
    is OAuth 2.0 Authorization Code or Client Credentials against the instance's own /oauth/authorize and
    /oauth/token endpoints; access tokens use a rolling 30-day idle expiration. The endpoint reference and
    Postman collections are published behind a customer login on the Mitratech Success Center.
  humanURL: https://success.mitratech.com/TeamConnect/TeamConnect_Setup_and_Development/TeamConnect_REST_API_Modernization_(TCE_7.2)
  baseURL: https://{your-tc-instance}/webservice/enterprise/v1
