- name: Mitratech MCP Server
  description: >-
    Remote Model Context Protocol server served from mitratech.com over Streamable HTTP. Advertises OAuth
    2.0 authorization-server metadata at /.well-known/oauth-authorization-server and protected-resource
    metadata at /.well-known/oauth-protected-resource, with PKCE S256, dynamic client-id metadata documents
    and a single `mcp` scope. tools/list returns HTTP 401 `mcp_unauthorized` anonymously, so the tool
    manifest requires an authenticated OAuth introspection; the endpoint itself is live and probed.
  humanURL: https://mitratech.com/
  baseURL: https://mitratech.com/wp-json/mcp/mcp-oauth-server
  image: https://mitratech.com/wp-content/uploads/Mitratech_Web-Assets_Home-Feature-Image-HD-1024x577.png
  position: Producing
  tags:
  - MCP
  - Compliance
  tags_raw:
  - mcp
  - compliance
