apis:
- name: Mitratech TeamConnect REST API
  description: >-
    Modernized REST API shipped with TeamConnect Enterprise 7.2 and later, served from each customer's
    own TeamConnect instance at /webservice/enterprise/. Exposes Accounts, Appointments, Contacts, Documents,
    Expenses, Groups, Histories, Invoices, Involved Parties, Projects (custom objects / matters), Tasks,
    Users, Workflows and System Design, with pagination, filtering and record-level search. Authentication
    is OAuth 2.0 Authorization Code or Client Credentials against the instance's own /oauth/authorize
    and /oauth/token endpoints; access tokens use a rolling 30-day idle expiration. The endpoint reference
    and Postman collections are published behind a customer login on the Mitratech Success Center.
  humanURL: >-
    https://success.mitratech.com/TeamConnect/TeamConnect_Setup_and_Development/TeamConnect_REST_API_Modernization_(TCE_7.2)
  baseURL: https://{your-tc-instance}/webservice/enterprise/v1
  image: >-
    https://mitratech.com/wp-content/uploads/Mitratech_Web-Assets_Home-Feature-Image-HD-1024x577.png
  position: Producing
  tags:
  - Enterprise Legal Management
  - Matter Management
  - Legal Operations
  tags_raw:
  - enterprise-legal-management
  - matter-management
  - legal-operations
  properties:
  - type: Documentation
    url: >-
      https://success.mitratech.com/TeamConnect/TeamConnect_Setup_and_Development/TeamConnect_REST_API_Modernization_(TCE_7.2)
  - type: Authentication
    url: >-
      https://success.mitratech.com/TeamConnect/TeamConnect_Setup_and_Development/TeamConnect_REST_API_Modernization_(TCE_7.2)/TeamConnect_RESTAPIs_-_Authentication
- name: Mitratech MCP Server
  description: >-
    Remote Model Context Protocol server served from mitratech.com over Streamable HTTP. Advertises OAuth
    2.0 authorization-server metadata at /.well-known/oauth-authorization-server and protected-resource
    metadata at /.well-known/oauth-protected-resource, with PKCE S256, dynamic client-id metadata documents
    and a single `mcp` scope. tools/list returns HTTP 401 `mcp_unauthorized` anonymously, so the tool
    manifest requires an authenticated OAuth introspection; the endpoint itself is live and probed.
  humanURL: https://mitratech.com/
  baseURL: https://mitratech.com/wp-json/mcp/mcp-oauth-server
  image: >-
    https://mitratech.com/wp-content/uploads/Mitratech_Web-Assets_Home-Feature-Image-HD-1024x577.png
  position: Producing
  tags:
  - MCP
  - Compliance
  tags_raw:
  - mcp
  - compliance
