apis:
- name: Mitratech TAP Workflow Automation API
  description: >-
    REST API for the TAP (ThinkSmart Automation Platform) no-code workflow automation product. Covers
    workflow initiation and continuation, form retrieval and save, task assignment and re-assignment,
    dashboard and grid configuration, comments and collaboration discussions, audit trail retrieval,
    file attachments and signed-document handling, archive/restore/delete of workflow records, and user,
    role and department administration including bulk add-or-update. URL elements and query parameters
    follow Microsoft's OData conventions ($top, $skip, $filter, $orderby). Auth is OAuth 2.0 resource
    owner password credentials against /auth/identity/connect/token with scope `api`; tokens are bearer
    tokens valid for 3600 seconds.
  humanURL: https://success.mitratech.com/TAP/TAP_Solutions/APIs_and_Integrations/TAP_API_Documentation
  baseURL: https://{tenant}.tap.thinksmart.com/{tenant}/api
