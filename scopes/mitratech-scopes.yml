notes:
- >-
  TeamConnect's OAuth documentation describes scope as "(Optional) Specify the scope required for
  access" and publishes no scope values at all. No TeamConnect scopes are recorded here because none
  are published — an honest absence, not an omission.
- >-
  Least privilege is not expressible on TAP. Mitratech's own guidance is to use a Super Admin account
  to obtain the token, warning that a narrower account may silently return incomplete results. An
  agent therefore cannot be granted a read-only or single-object token.
