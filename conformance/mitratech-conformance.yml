summary: >-
  Mitratech's strongest conformance signal is on the MCP surface, where it serves both RFC 8414 and
  RFC 9728 discovery documents correctly. The TAP REST API declares OData query conventions in its own
  contract but ships no OData service document, and the TeamConnect surface is documented as OAuth 2.0
  but its contract is not public.
conformance:
- id: oauth2
  label: OAuth 2.0 (RFC 6749)
  conforms: true
  evidence: >-
    All three surfaces authenticate with OAuth 2.0. TAP documents the resource owner password
    credentials grant at /auth/identity/connect/token; TeamConnect documents authorization code and
    client credentials at /webservice/enterprise/oauth/token; the MCP server advertises
    authorization_code + refresh_token.
  sources:
  - https://success.mitratech.com/TAP/TAP_Solutions/APIs_and_Integrations/TAP_API_Documentation
  - https://success.mitratech.com/TeamConnect/TeamConnect_Setup_and_Development/TeamConnect_REST_API_Modernization_(TCE_7.2)/TeamConnect_RESTAPIs_-_Authentication
  - https://mitratech.com/.well-known/oauth-authorization-server
- id: rfc6750
  label: OAuth 2.0 Bearer Token Usage
  conforms: true
  evidence: >-
    TAP returns {"token_type":"Bearer"} and documents `Authorization: Bearer <token>` on every sample
    request. The MCP protected-resource metadata declares bearer_methods_supported ["header"].
- id: rfc8414
  label: OAuth 2.0 Authorization Server Metadata
  conforms: true
  evidence: 'https://mitratech.com/.well-known/oauth-authorization-server — HTTP 200, well-formed metadata with issuer, authorization_endpoint, token_endpoint, revocation_endpoint, grant_types_supported and code_challenge_methods_supported.'
  file: well-known/mitratech-oauth-authorization-server.json
- id: rfc9728
  label: OAuth 2.0 Protected Resource Metadata
  conforms: true
  evidence: 'https://mitratech.com/.well-known/oauth-protected-resource — HTTP 200, names the MCP resource and its authorization_servers.'
  file: well-known/mitratech-oauth-protected-resource.json
- id: rfc7636
  label: PKCE (Proof Key for Code Exchange)
  conforms: true
  evidence: 'code_challenge_methods_supported: ["S256"] on the mitratech.com authorization-server metadata.'
- id: rfc7009
  label: OAuth 2.0 Token Revocation
  conforms: true
  evidence: 'revocation_endpoint: https://mitratech.com/oauth/revoke declared in the authorization-server metadata.'
- id: mcp
  label: Model Context Protocol
  conforms: true
  evidence: >-
    A live JSON-RPC endpoint at https://mitratech.com/wp-json/mcp/mcp-oauth-server answering a
    tools/list POST with the MCP-specific error {"code":"mcp_unauthorized"} and HTTP 401, backed by
    RFC 9728 protected-resource metadata. Transport is Streamable HTTP.
  note: Conformance to the tool schema could not be graded — tools/list is auth-gated.
- id: openid-connect
  label: OpenID Connect Discovery
  conforms: false
  evidence: /.well-known/openid-configuration returns HTTP 404 on mitratech.com, www.mitratech.com and success.mitratech.com.
- id: rfc9457
  label: 'RFC 9457: Problem Details for HTTP APIs'
  conforms: false
  evidence: >-
    No application/problem+json media type and no error schema appears anywhere in the 135KB TAP
    Swagger document; every 4xx/5xx response is a bare status code.
- id: rfc9116
  label: 'RFC 9116: security.txt'
  conforms: false
  evidence: >-
    /.well-known/security.txt returns 404 on mitratech.com and www.mitratech.com. The file served on
