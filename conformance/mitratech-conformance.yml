- id: openapi
  label: OpenAPI / Swagger
  conforms: true
  version: Swagger 2.0
  evidence: >-
    https://default.stagingtap.thinksmart.com/default/api/swagger-docs/v1 — HTTP 200, 135KB, parses as
    Swagger 2.0 with 45 paths, 49 operations and 91 definitions.
  gap: >-
    The document is two major versions behind (Swagger 2.0, superseded by OpenAPI 3.0 in 2017) and
    declares no securityDefinitions, so the OAuth model it depends on is absent from the contract.
domain_standards:
- id: odata-uri-conventions
  label: OData URI conventions (query)
  conforms: true
  market: Enterprise data query
  evidence_type: contract
  evidence: >-
    The TAP contract itself declares the OData $-prefixed query vocabulary on its collection
    operations — GET /v1/users in openapi/_original/mitratech-tap-swagger.json carries $top, $skip,
    $filter, $select, $orderby and $inlinecount as named query parameters. Mitratech's own
    documentation states "The TAP API follows Microsoft's OData standard for all URL Elements &
    parameters" and links the OData 2.0 URI-conventions specification.
  corroborating_evidence: >-
    The document's definitions block also carries ten OData model types from the ASP.NET Web API OData
    stack — ODataQueryOptions, ODataQueryOptions[GridConfiguration],
    ODataQueryOptions[AdvancedUserModel], ODataQueryOptions[WorkflowTemplate], ODataQueryContext,
    ODataRawQueryOptions, ODataQueryValidator, ODataQuerySettings, ODataPath and ODataPathSegment —
    so the OData layer is in the implementation, not just in the prose.
  sources:
  - openapi/_original/mitratech-tap-swagger.json
  - https://success.mitratech.com/TAP/TAP_Solutions/APIs_and_Integrations/TAP_API_Documentation
  - https://www.odata.org/documentation/odata-version-2-0/uri-conventions/
  buyer_impact: >-
    A consumer who already speaks OData can filter and page TAP's user collection with no bespoke
    connector — but only that collection. The workflow collections, which are the product's centre of
    gravity, use a separate bespoke vocabulary (page, pageSize, search, orderBy, orderDirection,
    advancedFilter), so the standard covers a minority of the surface.
- id: odata-metadata
  label: OData service document / $metadata (CSDL)
  conforms: false
  evidence: >-
    Probed 2026-09-13 — /default/api/$metadata, /default/api/v1/$metadata and
    /default/api/v1/users/$metadata all return HTTP 404 on default.stagingtap.thinksmart.com. Without
    a CSDL document, generic OData tooling cannot bind to the service; the OData claim is
    URI-convention-level only.
security_claims:
- id: fips-140-2
  label: FIPS 140-2 compliant encryption at rest
  conforms: vendor-claimed
  evidence: >-
    https://mitratech.com/security/ — "We've partnered with the industry leading cryptography provider
    for our FIPS 140-2 compliant encryption at-rest solution, protecting client data within
    Mitratech's cloud environment."
  note: >-
    A self-asserted product claim about a third-party cryptography module, not a Mitratech
    certification, attestation or audit report. No SOC 2, ISO 27001, HIPAA, PCI or FedRAMP claim
    appears on any first-party Mitratech page, and no trust centre is served at
    mitratech.com/trust/, /trust-center/, /compliance/ or trust.mitratech.com (all probed
    2026-09-13; 404 or no DNS). NO `Compliance` or `TrustCenter` pointer is emitted — the ISO 27001
    and SOC 2 mentions on mitratech.com are frameworks the Alyne GRC PRODUCT helps customers assess
    against, not certifications Mitratech holds.
