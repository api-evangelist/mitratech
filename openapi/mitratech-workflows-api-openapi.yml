openapi: 3.2.0
info:
  version: v1
  title: TAP API Explorer Workflows API
servers:
- url: https://demo.tap.thinksmart.com/prod/api
tags:
- name: Workflows
paths:
  /v1/workflows/all:
    get:
      tags:
      - Workflows
      summary: All Workflows
      description: Method that will return all dashboard workflows (does not support OData filtering yet)
      operationId: Workflows_GetAll
      parameters:
      - name: pageSize
        in: query
        description: Page size
        required: true
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        description: Number of displayed page
        required: true
        schema:
          type: integer
          format: int32
      - name: configurationId
        in: query
        description: Id of Workflow Dashboard configuration
        required: false
        schema:
          type: string
          format: uuid
      - name: search
        in: query
        description: Text for search filter
        required: false
        schema:
          type: string
      - name: orderBy
        in: query
        description: Field name for sorting
        required: false
        schema:
          type: string
      - name: orderDirection
        in: query
        description: 'Direction of sorting. Possible values: ASC, DESC'
        required: false
        schema:
          type: string
      - name: advancedFilter
        in: query
        description: 'Advanced filter for records (e.g. : column1~startswith~''value''~and~column2~eq~''value'')'
        required: false
        schema:
          type: string
      - name: dynamicColumns
        in: query
        description: Dynamic columns separated with comma to select and filter on
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardWorkflowsList'
            text/json:
              schema:
                $ref: '#/components/schemas/DashboardWorkflowsList'
            application/xml:
              schema:
                $ref: '#/components/schemas/DashboardWorkflowsList'
            text/xml:
              schema:
                $ref: '#/components/schemas/DashboardWorkflowsList'
        '404':
          description: Not Found
  /v1/workflows/my:
    get:
      tags:
      - Workflows
      summary: Assigned Workflows
      description: Method that will return workflows related to requestor (does not support OData filtering yet)
      operationId: Workflows_GetMy
      parameters:
      - name: pageSize
        in: query
        description: Page size
        required: true
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        description: Number of displayed page
        required: true
        schema:
          type: integer
          format: int32
      - name: configurationId
        in: query
        description: Id of Workflow Dashboard configuration
        required: false
        schema:
          type: string
          format: uuid
      - name: search
        in: query
        description: Text for search filter
        required: false
        schema:
          type: string
      - name: orderBy
        in: query
        description: Field name for sorting
        required: false
        schema:
          type: string
      - name: orderDirection
        in: query
        description: 'Direction of sorting. Possible values: ASC, DESC'
        required: false
        schema:
          type: string
      - name: advancedFilter
        in: query
        description: 'Advanced filter for records (e.g. : column1~startswith~''value''~and~column2~eq~''value'')'
        required: false
        schema:
          type: string
      - name: dynamicColumns
        in: query
        description: Dynamic columns separated with comma to select and filter on
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardWorkflowsList'
            text/json:
              schema:
                $ref: '#/components/schemas/DashboardWorkflowsList'
            application/xml:
              schema:
                $ref: '#/components/schemas/DashboardWorkflowsList'
            text/xml:
              schema:
                $ref: '#/components/schemas/DashboardWorkflowsList'
        '404':
          description: Not Found
  /v1/workflows/actionrequired:
    get:
      tags:
      - Workflows
      summary: Action Required Workflows
      description: Method that will return workflows that required action of requestor (does not support OData filtering yet)
      operationId: Workflows_GetActionRequired
      parameters:
      - name: pageSize
        in: query
        description: Page size
        required: true
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        description: Number of displayed page
        required: true
        schema:
          type: integer
          format: int32
      - name: configurationId
        in: query
        description: Id of Workflow Dashboard configuration
        required: false
        schema:
          type: string
          format: uuid
      - name: search
        in: query
        description: Text for search filter
        required: false
        schema:
          type: string
      - name: orderBy
        in: query
        description: Field name for sorting
        required: false
        schema:
          type: string
      - name: orderDirection
        in: query
        description: 'Direction of sorting. Possible values: ASC, DESC'
        required: false
        schema:
          type: string
      - name: advancedFilter
        in: query
        description: 'Advanced filter for records (e.g. : column1~startswith~''value''~and~column2~eq~''value'')'
        required: false
        schema:
          type: string
      - name: dynamicColumns
        in: query
        description: Dynamic columns separated with comma to select and filter on
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardWorkflowsList'
            text/json:
              schema:
                $ref: '#/components/schemas/DashboardWorkflowsList'
            application/xml:
              schema:
                $ref: '#/components/schemas/DashboardWorkflowsList'
            text/xml:
              schema:
                $ref: '#/components/schemas/DashboardWorkflowsList'
        '404':
          description: Not Found
  /v1/workflows/getarchivedrecords:
    get:
      tags:
      - Workflows
      summary: GetArchivedRecords
      description: Method that will return workflows that that have been archived
      operationId: Workflows_GetArchivedRecords
      parameters:
      - name: pageSize
        in: query
        description: Page size
        required: true
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        description: Number of displayed page
        required: true
        schema:
          type: integer
          format: int32
      - name: search
        in: query
        description: Text for search filter
        required: false
        schema:
          type: string
      - name: orderBy
        in: query
        description: Field name for sorting
        required: false
        schema:
          type: string
      - name: orderDirection
        in: query
        description: 'Direction of sorting. Possible values: ASC, DESC'
        required: false
        schema:
          type: string
      - name: advancedFilter
        in: query
        description: 'Advanced filter for records (e.g. : column1~startswith~''value''~and~column2~eq~''value'')'
        required: false
        schema:
          type: string
      - name: additionalDynamicColumns
        in: query
        description: Dynamic columns separated with comma to select and filter on
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicWorkflowDetailsList'
            text/json:
              schema:
                $ref: '#/components/schemas/BasicWorkflowDetailsList'
            application/xml:
              schema:
                $ref: '#/components/schemas/BasicWorkflowDetailsList'
            text/xml:
              schema:
                $ref: '#/components/schemas/BasicWorkflowDetailsList'
        '404':
          description: Not Found
  /v1/workflows/{taskId}/view:
    get:
      tags:
      - Workflows
      summary: Task Values
      description: View values from specific workflow task by "taskId"
      operationId: Workflows_GetTaskValues
      parameters:
      - name: taskId
        in: path
        description: ID of workflow task
        required: true
        schema:
          type: string
          format: uuid
      - name: include
        in: query
        description: Additional properties to include. Use "fieldCode" value to add EchoSign code to result.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskValue'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskValue'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskValue'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskValue'
        '404':
          description: Not Found
  /v1/workflows/form:
    get:
      tags:
      - Workflows
      summary: Form Info
      description: View form info for workflow initiation or continuation. If there is only templateId provided - will return info for start stage.
      operationId: Workflows_GetWorkflowForm
      parameters:
      - name: templateId
        in: query
        description: ID of workflow template
        required: false
        schema:
          type: string
          format: uuid
      - name: tokenId
        in: query
        description: ID of workflow token (for continuation only)
        required: false
        schema:
          type: string
          format: uuid
      - name: additionalInfo
        in: query
        description: Adds additional field info into result
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowForm'
            text/json:
              schema:
                $ref: '#/components/schemas/WorkflowForm'
            application/xml:
              schema:
                $ref: '#/components/schemas/WorkflowForm'
            text/xml:
              schema:
                $ref: '#/components/schemas/WorkflowForm'
        '404':
          description: Not Found
  /v1/workflows/{templateId}/form:
    post:
      tags:
      - Workflows
      summary: Initiate
      description: 'Initiates workflow by workflow template ID. Allowed content types:


        multipart/form-data (only way to submit files) in structure fieldName:fieldValue


        application/x-www-form-urlencoded in structure fieldName=fieldValue


        application/json in structure { "fieldName" : "fieldValue" }'
      operationId: Workflows_InitiateWorkflow
      parameters:
      - name: templateId
        in: path
        description: ID of workflow template
        required: true
        schema:
          type: string
          format: uuid
      - name: title
        in: query
        description: Workflow Instance title
        required: false
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowSubmitResult'
            text/json:
              schema:
                $ref: '#/components/schemas/WorkflowSubmitResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/WorkflowSubmitResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/WorkflowSubmitResult'
  /v1/workflows/{tokenId}/form:
    put:
      tags:
      - Workflows
      summary: Continue
      description: 'Submit active workflow by Token ID. Allowed content types:


        multipart/form-data (only way to submit files) in structure fieldName:fieldValue


        application/x-www-form-urlencoded in structure fieldName=fieldValue


        application/json in structure { "fieldName" : "fieldValue" }'
      operationId: Workflows_ContinueWorkflow
      parameters:
      - name: tokenId
        in: path
        description: ID of workflow token
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowSubmitResult'
            text/json:
              schema:
                $ref: '#/components/schemas/WorkflowSubmitResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/WorkflowSubmitResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/WorkflowSubmitResult'
  /v1/workflows/saveform:
    put:
      tags:
      - Workflows
      summary: Save Workflow
      description: 'Save the form without submitting the stage.

        Save workflow by resultSetId or workflowName. Allowed content types:


        multipart/form-data (only way to submit files) in structure fieldName:fieldValue


        application/x-www-form-urlencoded in structure fieldName=fieldValue


        application/json in structure { "fieldName" : "fieldValue" }'
      operationId: Workflows_SaveWorkflow
      parameters:
      - name: resultsetId
        in: query
        description: ''
        required: false
        schema:
          type: string
          format: uuid
      - name: workflowName
        in: query
        description: ''
        required: false
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowSubmitResult'
            text/json:
              schema:
                $ref: '#/components/schemas/WorkflowSubmitResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/WorkflowSubmitResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/WorkflowSubmitResult'
  /v1/workflows/{resultSetId}/files:
    get:
      tags:
      - Workflows
      summary: File Attachments
      description: View workflow attachments by "resultSetId"
      operationId: Workflows_GetFiles
      parameters:
      - name: resultSetId
        in: path
        description: ID of workflow
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttachedFile'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttachedFile'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttachedFile'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttachedFile'
        '404':
          description: Not Found
  /v1/workflows/{resultSetId}/docs:
    get:
      tags:
      - Workflows
      summary: Signed Documents
      description: View workflow signed documents by "resultSetId"
      operationId: Workflows_GetDocuments
      parameters:
      - name: resultSetId
        in: path
        description: ID of workflow
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SignedDocument'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SignedDocument'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SignedDocument'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SignedDocument'
        '404':
          description: Not Found
    delete:
      tags:
      - Workflows
      summary: Cancel Sent Documents
      description: Terminates workflow instance by "resultSetId"
      operationId: Workflows_CancelDocuments
      parameters:
      - name: resultSetId
        in: path
        description: Unique ID of workflow instance
        required: true
        schema:
          type: string
          format: uuid
      - name: onlyReminders
        in: query
        description: Resets only reminders of workflow ("cancel and continue" if false)
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                format: uuid
                type: string
                example: 00000000-0000-0000-0000-000000000000
            text/json:
              schema:
                format: uuid
                type: string
                example: 00000000-0000-0000-0000-000000000000
            application/xml:
              schema:
                format: uuid
                type: string
                example: 00000000-0000-0000-0000-000000000000
            text/xml:
              schema:
                format: uuid
                type: string
                example: 00000000-0000-0000-0000-000000000000
        '404':
          description: Not Found
  /v1/workflows/{resultSetId}/cancel:
    delete:
      tags:
      - Workflows
      summary: Cancel Workflow
      description: Cancels workflow instance by "resultSetId"
      operationId: Workflows_Terminate
      parameters:
      - name: resultSetId
        in: path
        description: Unique ID of workflow instance
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
          content:
            text/plain:
              schema:
                type: string
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
            application/xml:
              schema:
                type: string
            text/xml:
              schema:
                type: string
        '404':
          description: Not Found
  /v1/workflows/{tokenId}/assign/{userId}:
    put:
      tags:
      - Workflows
      summary: Re-assign Workflow
      description: Assigns new user to specific workflow token by "tokenId"
      operationId: Workflows_Assign
      parameters:
      - name: tokenId
        in: path
        description: ID of workflow token
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        description: New user ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Ok
          content:
            text/plain:
              schema:
                type: string
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
            application/xml:
              schema:
                type: string
            text/xml:
              schema:
                type: string
        '404':
          description: Not Found
      requestBody:
        content:
          text/plain:
            schema:
              type: string
          text/csv:
            schema:
              type: string
          application/json:
            schema:
              type: string
          text/json:
            schema:
              type: string
          application/xml:
            schema:
              type: string
          text/xml:
            schema:
              type: string
          application/x-www-form-urlencoded:
            schema:
              type: string
        description: Comment about reassignment
        required: true
  /v1/workflows/archive:
    post:
      tags:
      - Workflows
      summary: Archive by ID
      description: Archives records by resultSetId. Archived records can be restored with Restore calls
      operationId: Workflows_ArchiveRecord
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
            text/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
            application/xml:
              schema:
                type: object
                additionalProperties:
                  type: boolean
            text/xml:
              schema:
                type: object
                additionalProperties:
                  type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                format: uuid
                type: string
                example: 00000000-0000-0000-0000-000000000000
          text/json:
            schema:
              type: array
              items:
                format: uuid
                type: string
                example: 00000000-0000-0000-0000-000000000000
          application/xml:
            schema:
              type: array
              items:
                format: uuid
                type: string
                example: 00000000-0000-0000-0000-000000000000
          text/xml:
            schema:
              type: array
              items:
                format: uuid
                type: string
                example: 00000000-0000-0000-0000-000000000000
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                format: uuid
                type: string
                example: 00000000-0000-0000-0000-000000000000
        description: List of IDs for the Records you wish to Archive.
        required: true
  /v1/workflows/archive/name:
    post:
      tags:
      - Workflows
      summary: Archive by Name
      description: Archives records by workflow name. Archived records can be restored with Restore calls
      operationId: Workflows_ArchiveRecord
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
            text/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
            application/xml:
              schema:
                type: object
                additionalProperties:
                  type: boolean
            text/xml:
              schema:
                type: object
                additionalProperties:
                  type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
          text/json:
            schema:
              type: array
              items:
                type: string
          application/xml:
            schema:
              type: array
              items:
                type: string
          text/xml:
            schema:
              type: array
              items:
                type: string
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                type: string
        description: A list of the Workflow Record names you wish to archive.
        required: true
  /v1/workflows/archive/filter:
    post:
      tags:
      - Workflows
      summary: Archive by Filter
      description: Archives records by Filter. Archived records can be restored with Restore calls
      operationId: Workflows_ArchiveRecord
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
            text/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
            application/xml:
              schema:
                type: object
                additionalProperties:
                  type: boolean
            text/xml:
              schema:
                type: object
                additionalProperties:
                  type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TapApiFilterStructureNotPaged'
          text/json:
            schema:
              $ref: '#/components/schemas/TapApiFilterStructureNotPaged'
          application/xml:
            schema:
              $ref: '#/components/schemas/TapApiFilterStructureNotPaged'
          text/xml:
            schema:
              $ref: '#/components/schemas/TapApiFilterStructureNotPaged'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TapApiFilterStructureNotPaged'
        required: true
  /v1/workflows/delete:
    post:
      tags:
      - Workflows
      summary: Delete by ID
      description: Deletes records by resultSetId. Deleted records are removed permanently
      operationId: Workflows_DeleteRecords
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
            text/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
            application/xml:
              schema:
                type: object
                additionalProperties:
                  type: boolean
            text/xml:
              schema:
                type: object
                additionalProperties:
                  type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                format: uuid
                type: string
                example: 00000000-0000-0000-0000-000000000000
          text/json:
            schema:
              type: array
              items:
                format: uuid
                type: string
                example: 00000000-0000-0000-0000-000000000000
          application/xml:
            schema:
              type: array
              items:
                format: uuid
                type: string
                example: 00000000-0000-0000-0000-000000000000
          text/xml:
            schema:
              type: array
              items:
                format: uuid
                type: string
                example: 00000000-0000-0000-0000-000000000000
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                format: uuid
                type: string
                example: 00000000-0000-0000-0000-000000000000
        description: The list of IDs you wish to delete
        required: true
  /v1/workflows/delete/name:
    post:
      tags:
      - Workflows
      summary: Delete by Name
      description: Deletes records by workflow name. Deleted records are removed permanently
      operationId: Workflows_DeleteRecords
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
            text/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
            application/xml:
              schema:
                type: object
                additionalProperties:
                  type: boolean
            text/xml:
              schema:
                type: object
                additionalProperties:
                  type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
          text/json:
            schema:
              type: array
              items:
                type: string
          application/xml:
            schema:
              type: array
