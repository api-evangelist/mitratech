components:
  schemas:
    BasicAuditTrailDetailsList:
      description: Wrapper for Basic audit trail details
      type: object
      properties:
        Items:
          description: Requested items
          type: array
          items:
            type: array
            items:
              $ref: '#/components/schemas/BasicAuditTrailDetails'
        Count:
          format: int32
          description: Total items
          type: integer
    Column:
      description: Dashboard Column definition
      type: object
      properties:
        Name:
          description: Column name
          type: string
        Label:
          description: Column Label
          type: string
        Value:
          description: Value
          type: string
    BasicCommentsFields:
      type: object
      properties:
        Items:
          description: Requested items
          type: array
          items:
            $ref: '#/components/schemas/CommentsDetailList'
        Count:
          format: int32
          description: Total items
          type: integer
    SignedDocument:
      description: Workflow signed document
      type: object
      properties:
        ID:
          format: uuid
          description: Document ID
          type: string
          example: 00000000-0000-0000-0000-000000000000
        Name:
          description: Document name
          type: string
        Status:
          description: Document status
          type: string
        SignedOn:
          format: date-time
          description: Date of signing
          type: string
        AgreementID:
          description: ESign agreement ID (Document Key)
          type: string
        UploadedOn:
          format: date-time
          description: Date of uploading
          type: string
        UploadedBy:
          description: User Uploaded
          type: string
    DashboardWorkflow:
      description: Workflow Instance definition for dashboard
      type: object
      properties:
        ResultSetId:
          format: uuid
          description: Workflow Instance ID
          type: string
          example: 00000000-0000-0000-0000-000000000000
        TaskId:
          format: uuid
          description: Task ID
          type: string
          example: 00000000-0000-0000-0000-000000000000
        TokenId:
          format: uuid
          description: Token ID
          type: string
          example: 00000000-0000-0000-0000-000000000000
        Columns:
          description: Column Collection
          type: array
          items:
            $ref: '#/components/schemas/Column'
        Actions:
          description: Allowed Actions
          type: array
          items:
            type: string
    WorkflowSubmitResult:
      description: Result message for workflow initiation or cintinuation
      type: object
      properties:
        ResultSetId:
          format: uuid
          description: Result Set ID of workflow instance
          type: string
          example: 00000000-0000-0000-0000-000000000000
        TokenCollection:
          description: Token IDs of new workflow stages
          type: array
          items:
            format: uuid
            type: string
            example: 00000000-0000-0000-0000-000000000000
    FormSection:
      type: object
      properties:
        title:
          type: string
        sectionIndex:
          format: int32
          type: integer
        HideSection:
          type: boolean
    TaskValue:
      description: Task value wrapper
      type: object
      properties:
        Label:
          description: Label for task value
          type: string
        Value:
          description: Task value
          type: string
        Code:
          description: Task code
          type: string
    AuditTrailDetailList:
      description: Workflow Attachment
      type: object
      properties:
        WorkflowName:
          type: string
        AuditTrailFieldLogStageList:
          type: array
          items:
            $ref: '#/components/schemas/AuditTrailFieldLogStage'
    DashboardWorkflowsList:
      description: Wrapper for Dashboard Workflows
      type: object
      properties:
        Items:
          description: Requested items
          type: array
          items:
            $ref: '#/components/schemas/DashboardWorkflow'
        Count:
          format: int32
          description: Total items
          type: integer
    SimpleFormField:
      description: Description of Form Field for submission
      type: object
      properties:
        ID:
          description: Element unique ID
          type: string
        Name:
          description: Element Name
          type: string
        Label:
          description: Label
          type: string
        Value:
          description: Predefined value
          type: string
        Required:
          description: Is Required
          type: boolean
        Editable:
          description: Is Editable
          type: boolean
        Validation:
          description: Validation for current field
          type: string
        FieldType:
          description: Type of field
          type: string
        AdditionalInfo:
          description: Additional Field info
          type: object
        RequiredForSave:
          type: boolean
    CommentsDetailList:
      description: CommentsDetailList
      type: object
      properties:
        WorkflowName:
          description: WorkflowName
          type: string
        Count:
          format: int32
          description: Count
          type: integer
        Error:
          description: Error
          type: string
        CommentsFieldsList:
          description: List of comments fields
          type: array
          items:
            type: object
    WorkflowForm:
      description: Object that describes workflow for submission
      type: object
      properties:
        TemplateId:
          format: uuid
          description: Workflow Template ID
          type: string
          example: 00000000-0000-0000-0000-000000000000
        ResultSetId:
          format: uuid
          description: Workflow Instance ID
          type: string
          example: 00000000-0000-0000-0000-000000000000
        TaskId:
          format: uuid
          description: Task ID
          type: string
          example: 00000000-0000-0000-0000-000000000000
        TokenId:
          format: uuid
          description: Token ID
          type: string
          example: 00000000-0000-0000-0000-000000000000
        TemplateName:
          description: Template Name
          type: string
        Title:
          description: Instance Name
          type: string
        StageTitle:
          description: Active Stage Title
          type: string
        Status:
          description: Workflow Status
          type: string
        ActiveRelationship:
          description: Current relationship (s)
          type: string
        IsContinuable:
          description: Is available for continuation
          type: boolean
        CurrentAssignee:
          description: Current Assegnee ID
          type: string
        IsWizardEnabled:
          description: If true - section fields should be grouped on UI
          type: boolean
        FormSections:
          description: Section names for workflow form
          type: array
          items:
            $ref: '#/components/schemas/FormSection'
        AdditionalWorkflowInfo:
          description: Additional Info
          type: object
        FormFields:
          description: Workflow Form Fields
          type: array
          items:
            $ref: '#/components/schemas/SimpleFormField'
    BasicAuditTrailDetails:
      description: Basic Audit Trail details Instance definition for workflows
      type: object
      properties:
        RecordName:
          description: Workflow Name
          type: string
        StageName:
          description: Stage Name
          type: string
        StageAssignedTo:
          description: stage assigned to
          type: string
        StageSubmittedBy:
          description: stage submitted by
          type: string
        DateSubmitted:
          description: Date Submitted
          type: string
        StatusSubmittedTo:
          description: status submitted to
          type: string
    AuditTrailFieldLogStage:
      description: Workflow Attachment
      type: object
      properties:
        Stage:
          description: Name of the stage
          type: string
        Date:
          format: date-time
          description: Timestamp when stage was saved
          type: string
        User:
          description: User that saved the stage
          type: string
        Status:
          description: Status of the stage
          type: string
        Fields:
          description: Specific field log
          type: array
